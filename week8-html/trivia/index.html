<!DOCTYPE html>

<html lang="en">
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
        <link href="styles.css" rel="stylesheet">
        <title>Trivia!</title>
        <script>
            // TODO: Add code to check answers to questions

            // To check multiple choice questions
            function checkanswer(content){
                const correctPlaceholder = document.getElementById("correctanswer")
                if (content.innerText != "25"){
                   content.style.background = "red";
                   correctPlaceholder.innerText = "Incorrect";
                } else {
                    content.style.background = "green";
                    correctPlaceholder.innerText = "Correct";
                }
            }

            // To check free response
            function checkSmart(){
                const correctPlaceholder = document.getElementById("correctResponse")
                const freeResponseAnswer = document.getElementById("freeResponse")

                if (freeResponseAnswer.value != "Madrid"){
                    correctPlaceholder.innerText = "Incorrect";
                    freeResponseAnswer.style.background = "red";
                } else {
                    correctPlaceholder.innerText = "Correct";
                    freeResponseAnswer.style.background = "green";
                }
            }
        </script>
    </head>
    <body>
        <div class="header">
            <h1>Trivia!</h1>
        </div>

        <div class="container">
            <div class="section">
                <h2>Part 1: Multiple Choice </h2>
                <hr>
                <!-- TODO: Add multiple choice question here -->
                 <h3>What is the result of 5x5?</h3>
                 <p id="correctanswer"></p>
                 <button onclick="checkanswer(this)">20</button>
                 <button onclick="checkanswer(this)">25</button>
                 <button onclick="checkanswer(this)">30</button>
                 <button onclick="checkanswer(this)">35</button>

            </div>

            <div class="section">
                <h2>Part 2: Free Response</h2>
                <hr>
                <!-- TODO: Add free response question here -->
                 <h3>What is the capital of Spain?</h3>
                 <p id="correctResponse"></p>
                 <form>
                    <input type ="text" id= "freeResponse">
                 </form>
                 <button onclick="checkSmart()">Check Answer</button>
            </div>
        </div>
    </body>
</html>
