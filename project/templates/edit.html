<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Edit vocabulary</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <h1>Edit vocabulary</h1>

  <!-- Formulario de búsqueda -->
  <form method="post">
    <input type="text" name="search_word"  class="input-text" placeholder="Search for german word" value="{{ query }}">
    <button type="submit" class="specialbutton">Search</button>
  </form>

  <!-- Mostrar resultados -->
  {% if results %}
    <table class="styled-table">
        <thead>
        <tr>
            <th>German</th>
            <th>Translation</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        {% for row in results %}
        <tr>
            <td>{{ row['german'] }}</td>
            <td>{{ row['translation'] }}</td>
            <td>
            <form action="{{ url_for('delete', id=row['id']) }}" method="post" style="display:inline;">
                <button type="submit" class="delete-button" onclick="return confirm('Are you sure you want to delete this word?');">Delete</button>
            </form>
            </td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
    {% endif %}

  <a href="/" class="back-link">Back</a>
</body>
</html>
